# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-regress-ci"
version = "0.1.0"
description = "Regression testing for LLM applications (CI for prompts)"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "jsonschema>=4.20",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
llm-regress = "llm_regress.cli:app"
llm-regress-server = "llm_regress.server.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
